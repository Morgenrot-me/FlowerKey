[package]
name = "flowerkey-desktop"
version = "1.0.3"
description = "花钥桌面端"
authors = ["FlowerKey"]
edition = "2021"

[lib]
name = "flowerkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
