# FlowerKey 多端自动发布
# 从版本标签对应的源码构建浏览器扩展、Android APK 和 Windows NSIS，
# 所有平台成功后才创建或更新 GitHub Release 附件。
name: 发布多端安装包

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "需要补发的已存在版本标签，例如 v1.0.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验版本标签
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 校验标签与项目版本
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # 只接受完整的三段式版本标签，避免手动输入分支或任意 Git ref。
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本标签必须符合 v*.*.*，当前为 $REQUESTED_TAG"
            exit 1
          fi

          # 手动补发也必须引用已经存在的 Git 标签，构建源码不能来自当前分支。
          if ! git show-ref --tags --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            echo "::error::Git 标签 $REQUESTED_TAG 不存在"
            exit 1
          fi

          VERSION="${REQUESTED_TAG#v}"
          COMMIT_SHA="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"

          # 验证逻辑由当前受审 workflow 提供，不执行历史标签内可能过时的同步脚本。
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.REQUESTED_TAG;
          const version = tag.slice(1);
          const failures = [];
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const expectVersion = (label, actual) => {
            if (actual !== version) failures.push(`${label}: ${actual ?? '缺失'}`);
          };

          expectVersion('package.json', readJson('package.json').version);
          for (const name of ['core', 'ui', 'extension', 'mobile', 'desktop']) {
            expectVersion(`packages/${name}/package.json`, readJson(`packages/${name}/package.json`).version);
          }
          expectVersion('tauri.conf.json', readJson('packages/desktop/src-tauri/tauri.conf.json').version);
          expectVersion('extension manifest', readJson('packages/extension/manifest.json').version);
          expectVersion('extension public manifest', readJson('packages/extension/public/manifest.json').version);

          const cargoToml = readFileSync('packages/desktop/src-tauri/Cargo.toml', 'utf8');
          expectVersion('Cargo.toml', cargoToml.match(/^version = "([^"]+)"/m)?.[1]);

          const gradle = readFileSync('packages/mobile/android/app/build.gradle', 'utf8');
          expectVersion('Android versionName', gradle.match(/versionName "([^"]+)"/)?.[1]);
          const expectedCode = version.split('.').map(Number);
          const versionCode = expectedCode[0] * 10000 + expectedCode[1] * 100 + expectedCode[2];
          const actualCode = Number(gradle.match(/versionCode (\d+)/)?.[1]);
          if (actualCode !== versionCode) failures.push(`Android versionCode: ${actualCode}`);

          const cargoLock = readFileSync('packages/desktop/src-tauri/Cargo.lock', 'utf8');
          const desktopBlock = cargoLock.split(/(?=^\[\[package\]\]$)/m)
            .find((block) => /^name = "flowerkey-desktop"$/m.test(block));
          const lockVersion = desktopBlock?.match(/^version = "([^"]+)"$/m)?.[1];
          if (lockVersion !== version) {
            if (tag === 'v1.0.2' && lockVersion === '0.5.1') {
              console.log('::warning::v1.0.2 的 Cargo.lock 保留发布自动化前旧值，Cargo 构建会刷新本地包版本');
            } else {
              failures.push(`Cargo.lock flowerkey-desktop: ${lockVersion ?? '缺失'}`);
            }
          }

          if (failures.length > 0) {
            console.error(`::error::标签内版本号不一致，期望 ${version}：${failures.join('；')}`);
            process.exit(1);
          }
          NODE

          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: 输出待发布提交
        shell: bash
        run: |
          # 在构建日志中保留标签与不可变提交，便于追查发布来源。
          echo "标签：${{ steps.version.outputs.tag }}"
          echo "提交：${{ steps.version.outputs.commit }}"

  quality:
    name: 发布质量门禁
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

      - name: 运行类型检查
        run: pnpm typecheck

      - name: 构建全部 Web 包
        run: pnpm build

  extension:
    name: 构建浏览器扩展
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并压缩扩展
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # ZIP 根目录必须直接包含 manifest.json，便于 Chrome / Edge 解压后加载。
          pnpm --filter @flowerkey/extension build
          mkdir -p release-artifacts
          cd packages/extension/dist
          zip -9 -r "../../../release-artifacts/FlowerKey-v${RELEASE_VERSION}-browser-extension.zip" .

      - name: 上传扩展工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-extension
          path: release-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: 构建 Android APK
    needs:
      - prepare
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建移动端 Web 资源并同步 Capacitor
        run: |
          pnpm --filter @flowerkey/mobile build
          pnpm --filter @flowerkey/mobile exec cap sync android

      - name: 解码并校验 Android 发布密钥
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FLOWERKEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOWERKEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLOWERKEY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # GitHub 正式发布必须同时具备密钥库、别名和两个密码，禁止回退为 debug 签名。
          for NAME in ANDROID_KEYSTORE_BASE64 FLOWERKEY_ANDROID_KEY_ALIAS FLOWERKEY_ANDROID_STORE_PASSWORD FLOWERKEY_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!NAME}" ]]; then
              echo "::error::缺少 GitHub Secret：$NAME"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/flowerkey-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 无法解码为有效密钥库文件"
            exit 1
          fi

          # 只把临时文件路径传给后续步骤，绝不把密钥内容或密码写入 GITHUB_ENV。
          echo "FLOWERKEY_ANDROID_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 构建固定签名 Release APK
        working-directory: packages/mobile/android
        shell: bash
        env:
          FLOWERKEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOWERKEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLOWERKEY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Windows 检出时 gradlew 没有可执行位；runner 中只为当前构建补齐。
          # 历史标签的 build.gradle 可能显式声明 debug signingConfig，会压过
          # android.injected.signing 注入，必须先移除该行；未来标签无此行时 sed 无副作用。
          sed -i '/signingConfig[[:space:]]\+signingConfigs[.]debug/d' app/build.gradle
          chmod +x gradlew
          ./gradlew \
            "-Dorg.gradle.java.home=$JAVA_HOME" \
            "-Pandroid.injected.signing.store.file=$FLOWERKEY_ANDROID_KEYSTORE" \
            "-Pandroid.injected.signing.store.password=$FLOWERKEY_ANDROID_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$FLOWERKEY_ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$FLOWERKEY_ANDROID_KEY_PASSWORD" \
            --no-daemon \
            --max-workers=2 \
            :app:assembleRelease

      - name: 核对 APK 发布证书
        shell: bash
        env:
          FLOWERKEY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOWERKEY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_ANDROID_CERT_SHA256: "7295bede9d97c3debf2841614a854a37b4de5dd5f29642e84d043cfea5b1996c"
        run: |
          # 先把 Secret 密钥库锁定到公开指纹，再逐个检查 APK，防止密钥被整体替换。
          KEYSTORE_CERT="$(
            keytool -exportcert \
              -keystore "$FLOWERKEY_ANDROID_KEYSTORE" \
              -storepass "$FLOWERKEY_ANDROID_STORE_PASSWORD" \
              -alias "$FLOWERKEY_ANDROID_KEY_ALIAS" |
              sha256sum |
              cut -d ' ' -f 1
          )"
          if [[ "$KEYSTORE_CERT" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "::error::GitHub Secret 中的 Android 密钥不是 FlowerKey 固定发布证书"
            exit 1
          fi
          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android SDK 中没有找到 apksigner"
            exit 1
          fi

          for APK in \
            packages/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            packages/mobile/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk; do
            ACTUAL_CERT="$(
              "$APKSIGNER" verify --print-certs "$APK" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
            )"
            if [[ "$ACTUAL_CERT" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
              echo "::error::$APK 的签名证书与固定发布密钥不一致"
              exit 1
            fi
          done

      - name: 清理 runner 临时发布密钥
        if: always()
        shell: bash
        run: |
          # 无论签名或证书检查是否成功，都立即删除当前 runner 上的临时密钥库副本。
          if [[ -n "${FLOWERKEY_ANDROID_KEYSTORE:-}" ]]; then
            rm -f -- "$FLOWERKEY_ANDROID_KEYSTORE"
          fi

      - name: 整理 APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # ABI 名称保留在公开文件名中，避免用户下载错误架构。
          mkdir -p release-artifacts
          cp packages/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "release-artifacts/FlowerKey-v${RELEASE_VERSION}-android-arm64-v8a.apk"
          cp packages/mobile/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            "release-artifacts/FlowerKey-v${RELEASE_VERSION}-android-armeabi-v7a.apk"

      - name: 上传 Android 工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: 构建 Windows 安装程序
    needs:
      - prepare
      - quality
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出标签源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust stable
        shell: pwsh
        run: |
          # GitHub Windows runner 已包含 rustup；显式选择 stable 保证 Tauri 使用受支持工具链。
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri NSIS
        run: pnpm --filter @flowerkey/desktop exec tauri build --bundles nsis

      - name: 整理 Windows 安装程序
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Tauri 文件名包含产品名和版本，统一复制为稳定的公开下载名称。
          $installer = Get-ChildItem "packages/desktop/src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "没有找到 Tauri NSIS 安装程序"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item $installer.FullName "release-artifacts/FlowerKey-v$env:RELEASE_VERSION-windows-x64-setup.exe"

      - name: 上传 Windows 工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: 更新 GitHub Release
    needs:
      - prepare
      - quality
      - extension
      - android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出已校验提交
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: 确认发布标签未移动
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          # 构建完成后再次解析标签；任何强制移动都会终止发布。
          CURRENT_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::标签 $RELEASE_TAG 在构建期间发生移动"
            exit 1
          fi

      - name: 下载全部平台工件
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成 SHA-256 校验清单
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 先按文件名稳定排序，再生成适用于 sha256sum -c 的清单。
          cd release-artifacts
          find . -maxdepth 1 -type f -name 'FlowerKey-*' -printf '%f\n' |
            sort |
            xargs sha256sum > "FlowerKey-v${RELEASE_VERSION}-SHA256SUMS.txt"

      - name: 创建或更新正式 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          # 强制刷新远端标签后再解析 peeled commit，不能复用 checkout 时的本地快照。
          git fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          CURRENT_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::标签 $RELEASE_TAG 在发布前发生移动"
            exit 1
          fi

          # 已有 Release 只覆盖同名附件并保留现有说明；新标签则由 GitHub 生成提交说明。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --verify-tag \
              --title "FlowerKey v${RELEASE_VERSION}" \
              --generate-notes
          fi
