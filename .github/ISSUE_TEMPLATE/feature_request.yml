name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么场景，为什么需要这个功能
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望的行为或界面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你尝试过的替代做法（可选）
  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - 全端
        - 浏览器插件
        - Android
        - iOS
        - Windows 桌面端
        - 用户脚本
